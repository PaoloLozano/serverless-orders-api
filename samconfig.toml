# AWS SAM CLI configuration: default arguments for `sam build`, `sam deploy`, etc.
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "serverless-orders-api"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "EnableCache=\"true\" CacheTtlSeconds=\"300\""

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

# Cheaper variant without the VPC/ElastiCache layer:
#   sam deploy --config-env nocache
[nocache.deploy.parameters]
stack_name = "serverless-orders-api-nocache"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "EnableCache=\"false\""
