AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  serverless-orders-api - REST API for customer orders.
  API Gateway (HTTP API) -> AWS Lambda (Node.js 22, TypeScript) -> Amazon DynamoDB,
  with an Amazon ElastiCache Serverless (Valkey) cache-aside layer for order reads.

# -----------------------------------------------------------------------------
# Parameters & conditions
# -----------------------------------------------------------------------------
Parameters:
  EnableCache:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Deploy the VPC + ElastiCache Serverless (Valkey) cache-aside layer.
      Set to 'false' for a cheaper stack where every read goes to DynamoDB.
  CacheTtlSeconds:
    Type: Number
    Default: 300
    MinValue: 10
    MaxValue: 86400
    Description: Time-to-live of cached orders, in seconds.
  LogRetentionInDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: CloudWatch Logs retention for the functions and the API access logs.

Conditions:
  CacheEnabled: !Equals [!Ref EnableCache, 'true']

# -----------------------------------------------------------------------------
# Globals: settings shared by every function (SAM merges them into each one)
# -----------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64] # Graviton: ~20% cheaper per GB-second than x86
    MemorySize: 512
    Timeout: 10
    Tracing: Active # AWS X-Ray
    Environment:
      Variables:
        TABLE_NAME: !Ref OrdersTable
        DYNAMODB_ENDPOINT: '' # only overridden by `sam local` (see env.local.json)
        POWERTOOLS_SERVICE_NAME: orders-api
        POWERTOOLS_METRICS_NAMESPACE: ServerlessOrdersApi
        POWERTOOLS_LOG_LEVEL: INFO
        NODE_OPTIONS: --enable-source-maps

Resources:
  # ---------------------------------------------------------------------------
  # API Gateway (HTTP API)
  # ---------------------------------------------------------------------------
  OrdersApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Orders REST API
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600
      # Protects Lambda and DynamoDB from traffic spikes and abusive clients.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "method":"$context.httpMethod","path":"$context.path","routeKey":"$context.routeKey",
          "status":"$context.status","latencyMs":"$context.responseLatency",
          "integrationLatencyMs":"$context.integrationLatency"}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access-logs
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Lambda functions: one per route, each with least-privilege IAM permissions.
  # TypeScript is bundled by esbuild during `sam build` (see Metadata).
  # ---------------------------------------------------------------------------
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /customers/{customerId}/orders
      CodeUri: .
      Handler: create-order.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersApi
            Method: POST
            Path: /customers/{customerId}/orders
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/create-order.ts]
        Target: es2022
        Minify: true
        Sourcemap: true

  ListOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /customers/{customerId}/orders
      CodeUri: .
      Handler: list-orders.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Events:
        ListOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersApi
            Method: GET
            Path: /customers/{customerId}/orders
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/list-orders.ts]
        Target: es2022
        Minify: true
        Sourcemap: true

  # Uses the cache: attached to the VPC so it can reach ElastiCache.
  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /customers/{customerId}/orders/{orderId} (cache-aside read)
      CodeUri: .
      Handler: get-order.handler
      VpcConfig: !If
        - CacheEnabled
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          CACHE_ENDPOINT: !If [CacheEnabled, !GetAtt Cache.Endpoint.Address, '']
          CACHE_PORT: !If [CacheEnabled, !GetAtt Cache.Endpoint.Port, '6379']
          CACHE_TLS: 'true'
          CACHE_CLUSTER_MODE: 'true'
          CACHE_TTL_SECONDS: !Ref CacheTtlSeconds
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Events:
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersApi
            Method: GET
            Path: /customers/{customerId}/orders/{orderId}
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/get-order.ts]
        Target: es2022
        Minify: true
        Sourcemap: true

  # Uses the cache (to invalidate it after a write): attached to the VPC.
  UpdateOrderStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: PATCH /customers/{customerId}/orders/{orderId} (write + cache invalidation)
      CodeUri: .
      Handler: update-order-status.handler
      VpcConfig: !If
        - CacheEnabled
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          CACHE_ENDPOINT: !If [CacheEnabled, !GetAtt Cache.Endpoint.Address, '']
          CACHE_PORT: !If [CacheEnabled, !GetAtt Cache.Endpoint.Port, '6379']
          CACHE_TLS: 'true'
          CACHE_CLUSTER_MODE: 'true'
          CACHE_TTL_SECONDS: !Ref CacheTtlSeconds
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
      Events:
        UpdateOrderStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersApi
            Method: PATCH
            Path: /customers/{customerId}/orders/{orderId}
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/update-order-status.ts]
        Target: es2022
        Minify: true
        Sourcemap: true

  # Explicit log groups so logs expire instead of being kept (and billed) forever.
  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateOrderFunction}
      RetentionInDays: !Ref LogRetentionInDays

  ListOrdersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ListOrdersFunction}
      RetentionInDays: !Ref LogRetentionInDays

  GetOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetOrderFunction}
      RetentionInDays: !Ref LogRetentionInDays

  UpdateOrderStatusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${UpdateOrderStatusFunction}
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # DynamoDB: single table, composite primary key (partition key + sort key)
  #   PK = CUSTOMER#<customerId>   -> partition key (HASH): which partition stores the item
  #   SK = ORDER#<orderId (ULID)>  -> sort key (RANGE): order of items inside the partition
  # ---------------------------------------------------------------------------
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete # demo project; use Retain (and DeletionProtectionEnabled) in production
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub ${AWS::StackName}-orders
      BillingMode: PAY_PER_REQUEST # on-demand: no capacity planning, pay per request
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH # partition key
        - AttributeName: SK
          KeyType: RANGE # sort key
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------------
  # Cache layer (only when EnableCache=true)
  # ElastiCache only lives inside a VPC, so the functions that use it join a VPC too.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CacheEnabled
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CacheEnabled
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CacheEnabled
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-b

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CacheEnabled
    Properties:
      VpcId: !Ref Vpc

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CacheEnabled
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CacheEnabled
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Private subnets have no internet route. A DynamoDB *gateway* endpoint (free) gives the
  # VPC-attached functions a private path to DynamoDB, so no NAT Gateway is needed.
  DynamoDbVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CacheEnabled
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CacheEnabled
    Properties:
      GroupDescription: Lambda functions that use the cache
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Outbound to Valkey and to DynamoDB through the gateway endpoint

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CacheEnabled
    Properties:
      GroupDescription: ElastiCache Serverless, reachable only from the Lambda security group
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6380
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Valkey (6379 primary endpoint, 6380 reader endpoint)

  Cache:
    Type: AWS::ElastiCache::ServerlessCache
    Condition: CacheEnabled
    Properties:
      ServerlessCacheName: !Sub ${AWS::StackName}-cache
      Description: Cache-aside layer for order reads
      Engine: valkey
      MajorEngineVersion: '8'
      SecurityGroupIds: [!Ref CacheSecurityGroup]
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      # Hard limits keep the bill predictable.
      CacheUsageLimits:
        DataStorage:
          Maximum: 1
          Unit: GB
        ECPUPerSecond:
          Maximum: 5000

Outputs:
  ApiUrl:
    Description: Base URL of the Orders API
    Value: !Sub https://${OrdersApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  OrdersTableName:
    Description: DynamoDB table name
    Value: !Ref OrdersTable
  CacheEndpoint:
    Condition: CacheEnabled
    Description: ElastiCache Serverless (Valkey) endpoint
    Value: !GetAtt Cache.Endpoint.Address
