name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    # Same containers as docker-compose.yml, exposed on the same host ports.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8100:8000']
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6380:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration

  sam:
    name: SAM validate & build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - run: npm ci
      - run: sam validate --lint --region us-east-1
      - run: npm run build

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: sam
    # Only on pushes to main, and only once a GitHub OIDC role is configured in
    # Settings -> Secrets and variables -> Actions -> Variables -> AWS_DEPLOY_ROLE_ARN.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC: short-lived AWS credentials, no access keys stored in GitHub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: npm ci
      - run: npm run build
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
